name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
        working-directory: android
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -d firmware -e esp32_d1_mini -e ftms_test -e session_test -e history_test
